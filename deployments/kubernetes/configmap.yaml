apiVersion: v1
kind: ConfigMap
metadata:
  name: go-service-starter-config
  namespace: go-service-starter
  labels:
    app.kubernetes.io/name: go-service-starter
    app.kubernetes.io/part-of: go-service-starter
data:
  APP_NAME: go-service-starter
  APP_ENV: production
  HTTP_HOST: 0.0.0.0
  HTTP_PORT: "8080"
  HTTP_READ_TIMEOUT: 10s
  HTTP_READ_HEADER_TIMEOUT: 5s
  HTTP_WRITE_TIMEOUT: 10s
  HTTP_IDLE_TIMEOUT: 60s
  HTTP_MAX_BODY_BYTES: "1048576"
  LOG_LEVEL: info
  DATABASE_CONNECT_TIMEOUT: 5s
  DATABASE_READINESS_TIMEOUT: 2s
  TRACING_ENABLED: "false"
  TRACING_EXPORTER: stdout
  TRACING_SAMPLE_RATIO: "1"
  SHUTDOWN_TIMEOUT: 10s
