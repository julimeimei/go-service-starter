apiVersion: v1
kind: Service
metadata:
  name: go-service-starter
  namespace: go-service-starter
  labels:
    app.kubernetes.io/name: go-service-starter
    app.kubernetes.io/part-of: go-service-starter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: go-service-starter
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
