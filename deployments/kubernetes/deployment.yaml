apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-service-starter
  namespace: go-service-starter
  labels:
    app.kubernetes.io/name: go-service-starter
    app.kubernetes.io/part-of: go-service-starter
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-service-starter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-service-starter
        app.kubernetes.io/part-of: go-service-starter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/your-org/go-service-starter:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: go-service-starter-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: go-service-starter-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
